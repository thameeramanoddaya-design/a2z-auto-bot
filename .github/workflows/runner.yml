name: Run A2Z Bot

on:
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Install Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Run Bot with Virtual Display
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          A2Z_EMAIL: ${{ secrets.A2Z_EMAIL }}
          A2Z_PASSWORD: ${{ secrets.A2Z_PASSWORD }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1366x768x24" node index.js
