name: Run Puppeteer Bot Live

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Chrome & Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg ca-certificates procps libxss1
          sudo apt-get install -y libnss3 libatk-bridge2.0-0 libdrm2 libxkbcommon0 libgbm1 libasound2

      - name: Install Node Packages
        run: |
          npm install
          npm install puppeteer-extra puppeteer-extra-plugin-stealth google-spreadsheet google-auth-library

      - name: Run Puppeteer Script
        env:
          CI: true
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          A2Z_EMAIL: ${{ secrets.A2Z_EMAIL }}
          A2Z_PASSWORD: ${{ secrets.A2Z_PASSWORD }}
        run: |
          node index.js
