name: Run Puppeteer Bot on My PC

on:
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: |
          npm install puppeteer puppeteer-extra puppeteer-extra-plugin-stealth

      - name: Run Puppeteer Script (Visual Mode)
        run: |
          node index.js
